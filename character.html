<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra-Realistic 3D Body Foundry</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: #000; color: white; display: flex; height: 100vh; overflow: hidden; }
        
        /* Left: 3D Render Area */
        #render-container { flex: 1.5; position: relative; background: radial-gradient(circle, #1e293b 0%, #000 100%); }
        
        /* Right: 3D Blendshape Controls */
        .controls-box { flex: 1; padding: 20px; background: #0b0f19; overflow-y: auto; border-left: 1px solid #1f2937; }
        h3 { color: #38bdf8; font-size: 12px; text-transform: uppercase; border-bottom: 1px solid #1f2937; padding-bottom: 5px; }
        .slider-row { display: flex; align-items: center; margin-bottom: 15px; font-size: 12px; font-weight: bold; }
        .slider-row span { width: 120px; color: #9ca3af; }
        .slider-row input[type=range] { flex: 1; accent-color: #3b82f6; }
        
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; font-weight: bold; color: #3b82f6; z-index: 10; pointer-events: none; }
        .btn-save { background: #10b981; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="render-container">
        <div id="loading-text" class="loading">Loading Ultra 3D Core...</div>
        <!-- 3D Canvas will be injected here by Three.js -->
    </div>

    <div class="controls-box">
        <h3>🧬 3D Anatomy Morphing</h3>
        <p style="font-size: 10px; color: #ef4444;">*Requires 3D .glb model with Blendshapes</p>
        
        <div class="slider-row">
            <span>Chest / Bust Volume</span>
            <input type="range" id="morph-chest" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="slider-row">
            <span>Waist Narrowing</span>
            <input type="range" id="morph-waist" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="slider-row">
            <span>Hip / Glute Size</span>
            <input type="range" id="morph-hips" min="0" max="1" step="0.01" value="0.5">
        </div>
        
        <h3>🎨 Advanced Texturing</h3>
        <div class="slider-row">
            <span>Skin Tone (Albedo)</span>
            <input type="color" id="color-skin" value="#d28965">
        </div>

        <button class="btn-save" onclick="save3DDNA()">💾 Save 3D DNA & Enter World</button>
    </div>

    <!-- Three.js Library Import -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="js/character-editor.js"></script>
</body>
</html>
