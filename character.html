<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultra-Realistic 3D Body Foundry</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; background: #000; color: white; display: flex; height: 100vh; overflow: hidden; }
        
        #render-container { flex: 1.5; position: relative; background: radial-gradient(circle, #1e293b 0%, #000 100%); width: 100%; height: 100%; }
        
        .controls-box { flex: 1; padding: 15px; background: #0b0f19; overflow-y: auto; border-left: 1px solid #1f2937; max-height: 100vh; }
        h3 { color: #38bdf8; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid #1f2937; padding-bottom: 4px; margin-top: 15px; }
        .slider-row { display: flex; align-items: center; margin-bottom: 10px; font-size: 11px; font-weight: bold; }
        .slider-row span { width: 110px; color: #9ca3af; }
        .slider-row input[type=range] { flex: 1; accent-color: #3b82f6; }
        
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 18px; font-weight: bold; color: #3b82f6; z-index: 10; pointer-events: none; text-align: center; }
        .btn-save { background: #10b981; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 13px; }
        
        .magic-btn { background: linear-gradient(45deg, #a855f7, #ec4899); color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4); }
        .magic-btn:active { transform: scale(0.98); }

        /* Parts List Styling */
        #parts-list-container { background: rgba(255,255,255,0.05); border: 1px solid #334155; border-radius: 6px; padding: 8px; margin-top: 10px; max-height: 160px; overflow-y: auto; }
        .part-row { display: flex; justify-content: space-between; align-items: center; font-size: 10px; margin-bottom: 6px; background: rgba(0,0,0,0.5); padding: 5px 8px; border-radius: 4px; border-left: 3px solid #3b82f6; }
        .part-row button { background: #ef4444; color: white; border: none; padding: 3px 8px; border-radius: 3px; cursor: pointer; font-size: 9px; font-weight: bold; }
        .part-row button.show { background: #10b981; }

        @media (max-width: 768px) {
            body { flex-direction: column; height: 100vh; }
            #render-container { flex: 1; width: 100%; height: 45vh; }
            .controls-box { flex: 1.2; width: 100%; height: 55vh; border-left: none; border-top: 2px solid #1f2937; padding: 12px; }
        }
    </style>
</head>
<body>

    <div id="render-container">
        <div id="loading-text" class="loading">Loading 3D Core...</div>
    </div>

    <div class="controls-box">
        <h3>🧬 3D Anatomy Morphing</h3>
        <div class="slider-row">
            <span>Chest / Bust</span>
            <input type="range" id="morph-chest" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="slider-row">
            <span>Waist Narrow</span>
            <input type="range" id="morph-waist" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="slider-row">
            <span>Hip / Glute</span>
            <input type="range" id="morph-hips" min="0" max="1" step="0.01" value="0.5">
        </div>
        
        <h3>👗 Model Parts & Wardrobe Control</h3>
        <p style="font-size: 9px; color: #38bdf8; margin: 2px 0;">Toggle individual parts here to find clothes/body:</p>
        <div id="parts-list-container">
            <span style="font-size: 10px; color: #9ca3af;">Loading parts...</span>
        </div>

        <h3>🎨 Advanced Texturing</h3>
        <button class="magic-btn" onclick="applyMagicTexture()">✨ Magic (Apply Skin Texture)</button>
        <button class="btn-save" onclick="save3DDNA()">💾 Save 3D DNA & Enter World</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "fflate": "https://unpkg.com/three@0.160.0/examples/jsm/libs/fflate.module.js"
            }
        }
    </script>
    <script type="module" src="js/character-editor.js"></script>
    <script>
        window.applyMagicTexture = function() {
            window.dispatchEvent(new CustomEvent('applyMagicSkin'));
        };
        window.save3DDNA = function() {
            alert('Settings Saved! Proceeding...');
            window.location.href = 'lobby.html';
        };
    </script>
</body>
</html>
