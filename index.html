<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Universe | Login</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #1a1a1a; color: white; padding-top: 50px; }
        .box { background: #333; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; margin: auto; }
        input, select, button { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; box-sizing: border-box; }
        button { background: #ff4757; color: white; font-weight: bold; cursor: pointer; border: none; font-size: 16px;}
        button:disabled { background: #888; cursor: not-allowed; }
        #profileForm { display: none; }
        #loginStatus { color: #fbbf24; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🏎️ Racing Universe</h2>
        
        <div id="loginSection">
            <p>Welcome! Authenticate to enter the game.</p>
            <button id="googleLoginBtn">🔐 Login with Google</button>
            <p id="loginStatus">System Ready...</p>
        </div>

        <div id="profileForm">
            <h3>Set Your Identity</h3>
            <input type="text" id="gameName" placeholder="Enter Game Name" required>
            <select id="genderSelect"><option value="Boy">Boy</option><option value="Girl">Girl</option></select>
            <input type="number" id="ageInput" placeholder="Enter Age" required>
            <p id="gpsStatus">📍 Fetching GPS...</p>
            <button id="saveProfileBtn" disabled>Lock Profile & Enter Lobby</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithRedirect, getRedirectResult, onAuthStateChanged, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // 🔥 RACING ENGINE ACCOUNT KEYS (SINGLE DATABASE) 🔥
        const unifiedGameConfig = {
            apiKey: "AIzaSyCuYPugV4qIsu9ZT9E5l63bFLgIbte_S8I",
            authDomain: "racing-universe-engine.firebaseapp.com",
            projectId: "racing-universe-engine",
            storageBucket: "racing-universe-engine.firebasestorage.app",
            messagingSenderId: "572638328716",
            appId: "1:572638328716:web:830bd01db1fa5b45d948a9"
        };

        const app = initializeApp(unifiedGameConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let userLocation = null;

        const loginBtn = document.getElementById('googleLoginBtn');
        const loginStatus = document.getElementById('loginStatus');
        const saveProfileBtn = document.getElementById('saveProfileBtn');
        const gpsStatus = document.getElementById('gpsStatus');

        function fetchLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        gpsStatus.innerText = `📍 GPS Locked!`;
                        gpsStatus.style.color = "#4ade80"; 
                        saveProfileBtn.disabled = false;
                    },
                    (error) => {
                        gpsStatus.innerText = "❌ Location required to play!";
                        gpsStatus.style.color = "#ff4757"; 
                    }
                );
            } else {
                gpsStatus.innerText = "❌ GPS not supported!";
            }
        }

        loginBtn.addEventListener('click', (e) => {
            e.preventDefault(); 
            loginStatus.innerText = "Connecting to Google...";
            signInWithRedirect(auth, provider);
        });

        getRedirectResult(auth).catch((error) => {
            loginStatus.innerText = "❌ Login Error: " + error.message;
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                loginStatus.innerText = "Checking Game Profile...";
                
                try {
                    const userRef = doc(db, "Users", user.uid);
                    const docSnap = await getDoc(userRef);

                    if (docSnap.exists() && docSnap.data().gameName) {
                        loginStatus.innerText = `Welcome back! Redirecting...`;
                        setTimeout(() => { window.location.href = "lobby.html"; }, 1000);
                    } else {
                        document.getElementById('loginSection').style.display = 'none';
                        document.getElementById('profileForm').style.display = 'block';
                        fetchLocation();
                    }
                } catch (err) {
                    loginStatus.innerText = "❌ DB Error: " + err.message;
                }
            }
        });

        saveProfileBtn.addEventListener('click', async () => {
            const gameName = document.getElementById('gameName').value;
            const gender = document.getElementById('genderSelect').value;
            const age = document.getElementById('ageInput').value;

            if (!gameName || !age || !userLocation) {
                alert("Please fill all details and allow GPS!");
                return;
            }

            saveProfileBtn.innerText = "Locking Profile...";
            saveProfileBtn.disabled = true;

            try {
                const userRef = doc(db, "Users", currentUser.uid);
                
                await setDoc(userRef, {
                    name: currentUser.displayName,
                    email: currentUser.email,
                    gameName: gameName,
                    gender: gender,
                    age: parseInt(age),
                    location: userLocation,
                    vehicle: "Padal", 
                    role: "customer",
                    wallet_balance: 0,
                    joined: new Date().toISOString()
                }, { merge: true });
                
                window.location.href = "lobby.html";
            } catch (error) {
                alert("❌ Database Error! Try again.");
                saveProfileBtn.innerText = "Lock Profile & Enter Lobby";
                saveProfileBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
