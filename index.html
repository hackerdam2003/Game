    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        // Redirect hata kar signInWithPopup aur browserLocalPersistence add kiya
        import { getAuth, signInWithPopup, onAuthStateChanged, GoogleAuthProvider, browserLocalPersistence, setPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // 🔥 RACING ENGINE DATABASE KEYS 
        const engineConfig = {
            apiKey: "AIzaSyCuYPugV4qIsu9ZT9E5l63bFLgIbte_S8I",
            authDomain: "racing-universe-engine.firebaseapp.com",
            projectId: "racing-universe-engine",
            storageBucket: "racing-universe-engine.firebasestorage.app",
            messagingSenderId: "572638328716",
            appId: "1:572638328716:web:830bd01db1fa5b45d948a9"
        };

        const app = initializeApp(engineConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const loginBtn = document.getElementById('googleLoginBtn');
        const statusText = document.getElementById('statusText');

        // Force local persistence so mobile doesn't forget the user
        setPersistence(auth, browserLocalPersistence);

        // 🚀 POPUP LOGIN LOGIC
        loginBtn.addEventListener('click', async (e) => {
            e.preventDefault(); 
            statusText.innerText = "Opening Google Login...";
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                statusText.innerText = "❌ Login Error: " + error.message;
            }
        });

        // 🚀 THE REDIRECT BRAIN: Naya ya Purana User Check
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                statusText.innerText = "Login Success! Verifying identity...";
                try {
                    const docSnap = await getDoc(doc(db, "Users", user.uid));
                    if (docSnap.exists() && docSnap.data().gender) {
                        // Purana user -> Direct Lobby
                        window.location.href = "lobby.html";
                    } else {
                        // Naya user -> Profile Form
                        window.location.href = "profile.html";
                    }
                } catch (error) {
                    statusText.innerText = "❌ Database Error. Check Rules.";
                }
            }
        });
    </script>
