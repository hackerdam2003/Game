<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next-Gen Racing | Login</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #1a1a1a; color: white; padding-top: 50px; }
        .box { background: #333; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; margin: auto; }
        input, select, button { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; box-sizing: border-box; }
        button { background: #ff4757; color: white; font-weight: bold; cursor: pointer; border: none; }
        button:disabled { background: #888; cursor: not-allowed; }
        #profileForm { display: none; } /* Login ke baad dikhega agar naya user hai */
    </style>
</head>
<body>

    <div class="box">
        <h2>🏎️ Racing Universe</h2>
        
        <!-- Step 1: Google Login -->
        <div id="loginSection">
            <p>Welcome! Authenticate to enter the game.</p>
            <button id="googleLoginBtn">Login with Google</button>
            <p id="loginStatus" style="color: yellow; font-size: 14px;"></p>
        </div>

        <!-- Step 2: Strict Profile Lock Form -->
        <div id="profileForm">
            <h3>Set Your Identity (Permanent)</h3>
            <p style="color: #ff4757; font-size: 12px;">Warning: You cannot change this later!</p>
            
            <input type="text" id="gameName" placeholder="Enter Custom Game Name" required>
            
            <select id="genderSelect">
                <option value="Boy">Boy</option>
                <option value="Girl">Girl</option>
            </select>
            
            <input type="number" id="ageInput" placeholder="Enter your Age (e.g., 20)" required>
            
            <p id="gpsStatus">📍 Fetching GPS Location...</p>
            
            <button id="saveProfileBtn" disabled>Lock Profile & Enter Lobby</button>
        </div>
    </div>

    <!-- FIREBASE REAL WORKING SDK (Modular v9/v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 🔥 IMPORTANT: YAHAN APNI FIREBASE CONFIG KEYS DALNI HAI 🔥
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let userLocation = null;
        let currentUser = null;

        // Fetch GPS Logic
        function fetchLocation() {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    document.getElementById('gpsStatus').innerText = `📍 Location Locked!`;
                    document.getElementById('saveProfileBtn').disabled = false;
                },
                (error) => {
                    document.getElementById('gpsStatus').innerText = "❌ Please allow Location to play!";
                }
            );
        }

        // Google Login Button Click
        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            document.getElementById('loginStatus').innerText = "Logging in...";
            try {
                const result = await signInWithPopup(auth, provider);
                currentUser = result.user;
                
                // Check in Database if user already exists
                const docRef = doc(db, "users", currentUser.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    // Purana player hai -> Seedha Lobby me bhejo
                    document.getElementById('loginStatus').innerText = "Welcome back! Redirecting...";
                    window.location.href = "lobby.html";
                } else {
                    // Naya player hai -> Profile Lock Form dikhao aur GPS fetch karo
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('profileForm').style.display = 'block';
                    fetchLocation();
                }
            } catch (error) {
                console.error("Login Error:", error);
                document.getElementById('loginStatus').innerText = "Login Failed. Try again.";
            }
        });

        // Save Data to Database
        document.getElementById('saveProfileBtn').addEventListener('click', async () => {
            const gameName = document.getElementById('gameName').value;
            const gender = document.getElementById('genderSelect').value;
            const age = document.getElementById('ageInput').value;

            if (!gameName || !age) {
                alert("Please fill all details!");
                return;
            }

            document.getElementById('saveProfileBtn').innerText = "Saving & Locking...";
            document.getElementById('saveProfileBtn').disabled = true;

            try {
                // Database me permanent entry ban rahi hai (Coins 0 aur Padal default set ho raha hai)
                await setDoc(doc(db, "users", currentUser.uid), {
                    realName: currentUser.displayName,
                    gameName: gameName,
                    gender: gender,
                    age: parseInt(age),
                    location: userLocation,
                    coins: 0,
                    vehicle: "Padal"
                });
                
                // Save hone ke baad Lobby me bhej do
                window.location.href = "lobby.html";
            } catch (error) {
                console.error("Error saving profile:", error);
                alert("Error saving profile!");
                document.getElementById('saveProfileBtn').innerText = "Lock Profile & Enter Lobby";
                document.getElementById('saveProfileBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
