<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Character Engine - Live Test</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #32b2e8; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; font-size: 20px; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); display: none; z-index: 100; }
        
        /* Premium UI Controls */
        .ui-panel { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 15px; backdrop-filter: blur(5px); z-index: 100; }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn:hover { background: #2563eb; transform: scale(1.05); }
        .btn-girl { background: #10b981; }
        .btn-girl:hover { background: #059669; }
    </style>
</head>
<body>

    <div id="loading-text" class="loading">Loading Character... Please wait</div>

    <!-- UI Buttons to switch characters -->
    <div class="ui-panel">
        <button class="btn" onclick="loadCharacter('boy')">Load Boy</button>
        <button class="btn btn-girl" onclick="loadCharacter('girl')">Load Girl</button>
    </div>

    <!-- Three.js CDN Import -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. Scene & Camera Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#32b2e8'); 
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.2, 3.5); // Camera set in front of character

        // 2. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true; 
        document.body.appendChild(renderer.domElement);

        // 3. Premium Lighting Setup (For realistic shadows and skin glow)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); 
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2); 
        directionalLight.position.set(2, 5, 3);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0xe0eaff, 0.6); 
        fillLight.position.set(-5, 2, -5);
        scene.add(fillLight);

        // 4. Mouse Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1, 0); // Focus on waist/chest
        controls.minDistance = 1;     // Zoom in limit
        controls.maxDistance = 6;     // Zoom out limit
        controls.maxPolarAngle = Math.PI / 1.5; // Prevent camera from going under the floor

        // 5. Model Loader System (With Live Internet Links)
        const loader = new GLTFLoader();
        let currentModel = null;

        // 🔥 Live CDN Links for High-Quality 3D Models
        const models = {
            boy: 'https://models.readyplayer.me/64babcc2b0126957a2bd9a87.glb',
            girl: 'https://models.readyplayer.me/64babc88b0126957a2bd9a69.glb'
        };

        // Global function so buttons can access it
        window.loadCharacter = function(type) {
            document.getElementById('loading-text').style.display = 'block';

            // Remove old model if it exists
            if(currentModel) {
                scene.remove(currentModel);
            }

            // Load new model
            loader.load(
                models[type],
                function (gltf) {
                    currentModel = gltf.scene;
                    
                    // Center positioning
                    currentModel.position.set(0, 0, 0);
                    
                    // Enable shadows for the model
                    currentModel.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                            if(node.material) node.material.roughness = 0.6; // Better skin reflection
                        }
                    });

                    scene.add(currentModel);
                    document.getElementById('loading-text').style.display = 'none';
                },
                function (xhr) {
                    // Optional loading progress log
                    // console.log((xhr.loaded / xhr.total * 100) + '% loaded');
                },
                function (error) {
                    console.error('Error loading model:', error);
                    document.getElementById('loading-text').innerText = "Failed to load character! Check internet connection.";
                }
            );
        };

        // Load Default Character (Boy) automatically on start
        window.loadCharacter('boy');

        // 6. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        // 7. Window Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
