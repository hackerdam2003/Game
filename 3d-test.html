<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True 3D Character Engine</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #32b2e8; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; font-size: 24px; text-shadow: 2px 2px 5px rgba(0,0,0,0.5); display: none; z-index: 100; }
        
        /* Premium UI Controls */
        .ui-panel { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 15px; backdrop-filter: blur(5px); z-index: 100; }
        .btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn:hover { background: #2563eb; transform: scale(1.05); }
        .btn-girl { background: #10b981; }
        .btn-girl:hover { background: #059669; }
    </style>
</head>
<body>

    <div id="loading-text" class="loading">Loading 3D Model...</div>

    <!-- UI Buttons to switch characters -->
    <div class="ui-panel">
        <button class="btn" onclick="loadCharacter('boy')">Load Boy</button>
        <button class="btn btn-girl" onclick="loadCharacter('girl')">Load Girl</button>
    </div>

    <!-- Three.js CDN Import -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#32b2e8'); 

        // 2. Camera Setup
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 4); 

        // 3. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true; 
        document.body.appendChild(renderer.domElement);

        // 4. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5); 
        directionalLight.position.set(5, 5, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0xe0eaff, 0.5); 
        fillLight.position.set(-5, 3, -5);
        scene.add(fillLight);

        // 5. Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1, 0); 
        controls.minDistance = 1;
        controls.maxDistance = 6;
        controls.maxPolarAngle = Math.PI / 1.5;

        // 6. Model Loader System (Updated with 100% working GitHub links)
        const loader = new GLTFLoader();
        let currentModel = null;

        // 🔥 Ultra-Reliable Direct Links for Testing
        const models = {
            boy: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMan/glTF-Binary/CesiumMan.glb', // 3D Man in a suit
            girl: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/BrainStem/glTF-Binary/BrainStem.glb' // 3D Robot
        };

        window.loadCharacter = function(type) {
            document.getElementById('loading-text').style.display = 'block';

            if(currentModel) {
                scene.remove(currentModel);
            }

            loader.load(
                models[type],
                function (gltf) {
                    currentModel = gltf.scene;
                    currentModel.position.set(0, 0, 0);
                    currentModel.scale.set(1, 1, 1);
                    
                    currentModel.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                            if(node.material) node.material.roughness = 0.6;
                        }
                    });

                    scene.add(currentModel);
                    document.getElementById('loading-text').style.display = 'none';
                },
                function (xhr) {
                    // console.log((xhr.loaded / xhr.total * 100) + '% loaded');
                },
                function (error) {
                    console.error('Error loading model:', error);
                    document.getElementById('loading-text').innerText = "Model load fail ho gaya. Internet connection check karein!";
                }
            );
        };

        // Load Default
        window.loadCharacter('boy');

        // 7. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();

        // 8. Window Resize Handler
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
