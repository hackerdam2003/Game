<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Racing Universe | Island Mode</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        #game-canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }

        #enter-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.95); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .enter-btn { background: #10b981; color: white; border: none; padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }

        #hud { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        .hud-minimap { pointer-events: auto; }

        .joystick-zone { position: absolute; bottom: 20px; left: 30px; width: 130px; height: 130px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); pointer-events: auto; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .joystick-knob { width: 45px; height: 45px; background: rgba(255,255,255,0.6); border-radius: 50%; pointer-events: none; }

        .action-cluster { position: absolute; bottom: 20px; right: 30px; pointer-events: auto; width: 180px; height: 180px; z-index: 100; }
        .btn-action { position: absolute; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); transition: 0.1s; cursor: pointer; }
        .btn-action:active { background: rgba(255,255,255,0.4); transform: scale(0.9); }
        .btn-main { width: 70px; height: 70px; bottom: 10px; right: 10px; font-size: 24px; }
        .btn-skill { width: 50px; height: 50px; bottom: 90px; right: 20px; font-size: 18px; }
    </style>
</head>
<body>

    <div id="enter-overlay">
        <button class="enter-btn" onclick="window.enterWorld()">Drop to Island 🏝️</button>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="hud">
        
        <button onclick="window.location.href='lobby.html'" style="position: absolute; top: 15px; left: 15px; background: #ef4444; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; pointer-events: auto; cursor: pointer; z-index: 100000; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">⬅ Exit Island</button>

        <div class="top-right-controls" style="position: absolute; top: 15px; right: 140px; display: flex; gap: 15px; z-index: 100000; pointer-events: auto;">
            <div class="icon-btn-game" id="btn-mic-toggle" style="width: 45px; height: 45px; background: rgba(30,41,59,0.8); border: 2px solid #334155; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; backdrop-filter: blur(5px);">🔇</div>
            <div class="icon-btn-game" id="btn-chat-toggle" style="width: 45px; height: 45px; background: rgba(30,41,59,0.8); border: 2px solid #334155; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; backdrop-filter: blur(5px);">💬</div>
        </div>

        <div class="hud-minimap"></div>

        <div id="game-chat-box" style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 320px; height: 160px; background: rgba(0,0,0,0.6); border: 1px solid #334155; border-radius: 10px; display: none; flex-direction: column; pointer-events: auto; backdrop-filter: blur(5px); z-index: 100000;">
            <button id="close-chat-btn" style="position: absolute; top: 5px; right: 8px; background: none; border: none; color: #ef4444; font-size: 16px; font-weight: bold; cursor: pointer; z-index: 10001;" onclick="document.getElementById('game-chat-box').style.display='none'">✕</button>
            <div class="chat-msgs" id="in-game-msgs" style="flex: 1; overflow-y: auto; padding: 8px; margin-top: 15px; color: white; font-size: 11px; display: flex; flex-direction: column; gap: 4px;">
                <div><i style="color: #fbbf24;">Welcome to Island Global Chat...</i></div>
            </div>
            <div class="chat-input-row" style="display: flex; border-top: 1px solid #334;">
                <input type="text" id="game-chat-input" placeholder="Type team message..." autocomplete="off" style="flex: 1; background: transparent; border: none; color: white; padding: 8px; outline: none; font-size: 12px;">
                <button id="btn-send-chat" style="background: #3b82f6; border: none; color: white; padding: 0 14px; border-radius: 0 0 10px 0; font-weight: bold; cursor: pointer;">Send</button>
            </div>
        </div>

        <div class="joystick-zone" id="joystick-base">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>

        <div class="action-cluster">
            <div class="btn-action btn-main" id="btn-attack">⚔️</div>
            <div class="btn-action btn-skill" id="btn-skill">🔥</div>
        </div>
    </div>

    <audio id="bg-music" loop preload="auto">
        <source src="Sound/Music/BGM.mp3" type="audio/mpeg">
    </audio>

    <script src="/socket.io/socket.io.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="js/2engine.js"></script> 
</body>
</html>
