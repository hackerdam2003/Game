<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Racing Universe | Perfect Mansion Scene</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0f172a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        #house-canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }
        
        .back-btn { position: absolute; top: 20px; left: 20px; background: #ef4444; color: white; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        .switch-container { position: absolute; top: 70px; left: 20px; z-index: 1000; display: flex; flex-wrap: wrap; gap: 10px; max-width: 600px; }
        .switch-btn { background: #3b82f6; color: white; border: none; padding: 10px 15px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: 0.2s; }
        .switch-btn:active { transform: scale(0.95); }
        .switch-btn.active { background: #10b981; }

        .status-hud { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #38bdf8; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: bold; z-index: 1000; border: 1px solid #3b82f6; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.7); max-width: 90%; word-wrap: break-word; }
    </style>
</head>
<body>

    <button class="back-btn" onclick="window.location.href='game.html'">⬅ Back to World</button>
    
    <div class="switch-container">
        <button id="btn-home" class="switch-btn">🏠 Home.glb</button>
        <button id="btn-newhome" class="switch-btn">🏡 newhome.glb</button>
        <button id="btn-pool" class="switch-btn">🏊 Pool.glb</button>
        <button id="btn-chair" class="switch-btn">🪑 chair.glb</button>
        <button id="btn-mansion" class="switch-btn active" style="background: #ec4899;">🌟 Full Mansion Scene</button>
    </div>

    <div id="status-text" class="status-hud">
        ⏳ Loading Full Mansion Scene...
    </div>

    <canvas id="house-canvas"></canvas>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

        const canvas = document.getElementById('house-canvas');
        const statusEl = document.getElementById('status-text');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 20, 45); 

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(10, 0, 0);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const grid = new THREE.GridHelper(100, 100, 0x3b82f6, 0x1e293b);
        scene.add(grid);

        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');

        const gltfLoader = new GLTFLoader();
        gltfLoader.setDRACOLoader(dracoLoader); 

        const fbxLoader = new FBXLoader();

        let currentGroup = new THREE.Group();
        scene.add(currentGroup);

        function clearScene() {
            while(currentGroup.children.length > 0){ 
                currentGroup.remove(currentGroup.children[0]); 
            }
        }

        // Single GLB Loader
        window.loadGLBModel = function(filename) {
            clearScene();
            statusEl.innerHTML = `⏳ Loading ${filename}...`;
            statusEl.style.color = "#38bdf8";

            const url = `https://hackerdam2003.github.io/Game/${filename}`;
            
            gltfLoader.load(url, (gltf) => {
                const model = gltf.scene;
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());

                model.position.x = -center.x;
                model.position.y = -box.min.y; 
                model.position.z = -center.z;

                model.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                        if (node.material) {
                            node.material.side = THREE.DoubleSide;
                            node.material.alphaTest = 0.3; 
                        }
                    }
                });

                currentGroup.add(model);
                
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const camDistance = maxDim > 0 ? maxDim * 1.5 : 30; 

                camera.position.set(0, maxDim * 0.5, camDistance);
                controls.target.set(0, maxDim * 0.2, 0);
                controls.update();

                statusEl.innerHTML = `✅ SUCCESS: ${filename} Loaded Properly!`;
                statusEl.style.color = "#10b981";
            }, undefined, (error) => {
                statusEl.innerHTML = `❌ ERROR in ${filename}: File Not Found`;
                statusEl.style.color = "#ef4444";
            });
        };

        // 🌟 Full Mansion Scene (House + Fixed Pool Level + 4 Chairs + Hotgirl FBX)
        window.loadFullMansionScene = function() {
            clearScene();
            statusEl.innerHTML = `⏳ Building Perfect Mansion & Pool Scene...`;
            statusEl.style.color = "#38bdf8";

            // 1. House (Center)
            gltfLoader.load('https://hackerdam2003.github.io/Game/newhome.glb', (gltf) => {
                const house = gltf.scene;
                const box = new THREE.Box3().setFromObject(house);
                const scaleFactor = 30 / Math.max(box.getSize(new THREE.Vector3()).x, box.getSize(new THREE.Vector3()).y, box.getSize(new THREE.Vector3()).z);
                house.scale.set(scaleFactor, scaleFactor, scaleFactor);
                const center = new THREE.Box3().setFromObject(house).getCenter(new THREE.Vector3());
                house.position.set(-center.x, 0, -center.z);
                currentGroup.add(house);
            });

            // 2. Pool (Right Side - Y level fixed so water matches yellow patti)
            gltfLoader.load('https://hackerdam2003.github.io/Game/Pool.glb', (gltf) => {
                const pool = gltf.scene;
                const box = new THREE.Box3().setFromObject(pool);
                const scaleFactor = 15 / Math.max(box.getSize(new THREE.Vector3()).x, box.getSize(new THREE.Vector3()).y, box.getSize(new THREE.Vector3()).z);
                pool.scale.set(scaleFactor, scaleFactor, scaleFactor);
                
                // 🔥 Pool ko ghar ki yellow patti ke barabar ground par set kiya
                pool.position.set(22, 0, 0); 
                currentGroup.add(pool);

                // 3. Chairs around Pool (Upar surface par)
                gltfLoader.load('https://hackerdam2003.github.io/Game/chair.glb', (chairGltf) => {
                    const chairBase = chairGltf.scene;
                    
                    const chairPositions = [
                        { x: 16, z: 4, rot: Math.PI / 4 },
                        { x: 16, z: -3, rot: Math.PI / 4 },
                        { x: 26, z: 4, rot: -Math.PI / 4 },
                        { x: 26, z: -3, rot: -Math.PI / 4 }
                    ];

                    chairPositions.forEach(pos => {
                        const chair = chairBase.clone();
                        chair.scale.set(2, 2, 2);
                        chair.position.set(pos.x, 0, pos.z); // Zameen ke upar exact fit
                        chair.rotation.y = pos.rot;
                        currentGroup.add(chair);
                    });

                    // 4. Hotgirl FBX standing near pool/chair
                    fbxLoader.load('./Hotgirl.fbx', (fbx) => {
                        const hotgirl = fbx;
                        hotgirl.scale.set(0.06, 0.06, 0.06); // Proper human size
                        hotgirl.position.set(14, 0, 6); // Chair ke paas upar khadi hai
                        hotgirl.rotation.y = -Math.PI / 2;

                        // Texture mapping
                        const textureLoader = new THREE.TextureLoader();
                        textureLoader.load('./texture.jpg', (texture) => {
                            texture.colorSpace = THREE.SRGBColorSpace;
                            hotgirl.traverse((child) => {
                                if (child.isMesh && child.material) {
                                    child.material.map = texture;
                                    child.material.color.setHex(0xffffff);
                                    child.material.needsUpdate = true;
                                }
                            });
                        });

                        currentGroup.add(hotgirl);
                        statusEl.innerHTML = `✅ Mansion, Aligned Pool, Chairs & Hotgirl Loaded!`;
                        statusEl.style.color = "#10b981";
                    }, undefined, (err) => {
                        statusEl.innerHTML = `⚠️ Scene loaded, but Hotgirl.fbx not found!`;
                        statusEl.style.color = "#f59e0b";
                    });
                });
            });

            camera.position.set(0, 20, 45);
            controls.target.set(10, 0, 0);
            controls.update();
        };

        // Button Event Listeners
        document.getElementById('btn-home').addEventListener('click', (e) => {
            document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            window.loadGLBModel('Home.glb');
        });

        document.getElementById('btn-newhome').addEventListener('click', (e) => {
            document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            window.loadGLBModel('newhome.glb');
        });

        document.getElementById('btn-pool').addEventListener('click', (e) => {
            document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            window.loadGLBModel('Pool.glb');
        });

        document.getElementById('btn-chair').addEventListener('click', (e) => {
            document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            window.loadGLBModel('chair.glb');
        });

        document.getElementById('btn-mansion').addEventListener('click', (e) => {
            document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            window.loadFullMansionScene();
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Auto load full mansion scene on start
        window.loadFullMansionScene();
    </script>
</body>
</html>
