<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Racing Universe | Home.glb Direct Test</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0f172a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        #house-canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }

        /* Back to World Button */
        .back-btn { position: absolute; top: 20px; left: 20px; background: #ef4444; color: white; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        /* Status HUD */
        .status-hud { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #38bdf8; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: bold; z-index: 1000; border: 1px solid #3b82f6; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.7); }
    </style>
</head>
<body>

    <button class="back-btn" onclick="window.location.href='game.html'">⬅ Back to World</button>
    
    <div id="status-text" class="status-hud">
        ⏳ Connecting & Loading Home.glb (12.6 MB)... Please wait.
    </div>

    <!-- 3D Canvas -->
    <canvas id="house-canvas"></canvas>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Direct GLB Test Script -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const canvas = document.getElementById('house-canvas');
        const statusEl = document.getElementById('status-text');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Grid Helper taaki pata chale scene chal raha hai
        const grid = new THREE.GridHelper(30, 30, 0x3b82f6, 0x1e293b);
        grid.position.y = -0.01;
        scene.add(grid);

        // 🏠 Force Load Home.glb with Progress Tracker
        const gltfLoader = new GLTFLoader();
        
        gltfLoader.load(
            './Home.glb', 
            (gltf) => {
                const model = gltf.scene;
                model.scale.set(1, 1, 1);
                model.position.set(0, 0, 0);
                
                model.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });

                scene.add(model);
                statusEl.innerHTML = "✅ Home.glb Loaded Successfully!";
                statusEl.style.color = "#10b981";
                console.log("✅ Home.glb loaded successfully in test viewer!");
            }, 
            (xhr) => {
                if (xhr.lengthComputable) {
                    const percent = Math.floor((xhr.loaded / xhr.total) * 100);
                    statusEl.innerHTML = `📦 Loading Home.glb: ${percent}% Complete`;
                }
            }, 
            (error) => {
                console.error("❌ Failed to load Home.glb:", error);
                statusEl.innerHTML = "❌ Error: Home.glb failed to load. Check file path!";
                statusEl.style.color = "#ef4444";
            }
        );

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>
</html>
