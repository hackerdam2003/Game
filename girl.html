<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Character Animation Lab</title>
    <style>
        * { box-sizing: border-box; user-select: none; font-family: 'Segoe UI', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #1e293b; overflow: hidden; }
        
        #game-canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }

        /* Dev UI Sidebar */
        #anim-sidebar {
            position: absolute; right: 0; top: 0; width: 280px; height: 100vh;
            background: rgba(15, 23, 42, 0.9); border-left: 2px solid #3b82f6;
            display: flex; flex-direction: column; z-index: 10; backdrop-filter: blur(5px);
        }
        .sidebar-header {
            padding: 15px; background: #0f172a; color: #38bdf8; text-align: center;
            font-weight: bold; border-bottom: 2px solid #3b82f6; font-size: 16px;
        }
        
        /* 🚀 NAYA: Character Selector Styles */
        .char-select-container {
            margin-top: 10px; display: flex; flex-direction: column; gap: 5px; text-align: left;
        }
        select {
            width: 100%; padding: 8px; background: #1e293b; color: white;
            border: 1px solid #3b82f6; border-radius: 5px; outline: none; font-weight: bold;
        }

        #btn-container {
            flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px;
        }
        #btn-container::-webkit-scrollbar { width: 6px; }
        #btn-container::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }

        .anim-btn {
            background: #1e293b; color: white; border: 1px solid #475569; padding: 10px;
            border-radius: 8px; font-size: 14px; cursor: pointer; text-align: left;
            transition: 0.2s; display: flex; justify-content: space-between;
        }
        .anim-btn:hover { background: #3b82f6; border-color: #60a5fa; }
        .anim-btn.active { background: #10b981; border-color: #34d399; font-weight: bold; }

        #loading-overlay {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: #f59e0b; color: white; padding: 10px 20px; border-radius: 20px;
            font-weight: bold; z-index: 100; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .back-btn {
            position: absolute; top: 15px; left: 15px; background: #ef4444; color: white;
            border: none; padding: 10px 20px; font-weight: bold; border-radius: 8px;
            cursor: pointer; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <button class="back-btn" onclick="window.location.href='island.html'">⬅ Back</button>
    
    <div id="loading-overlay">⏳ Loading...</div>

    <canvas id="game-canvas"></canvas>

    <!-- Sidebar for Animation Buttons -->
    <div id="anim-sidebar">
        <div class="sidebar-header">
            💃 Animation Tester
            <!-- 🚀 NAYA: Character Select Dropdown -->
            <div class="char-select-container">
                <label style="font-size: 12px; color: #94a3b8;">Select Character:</label>
                <select id="char-selector">
                    <option value="Peasant Girl">Peasant Girl</option>
                    <option value="Man">Man</option>
                    <option value="Mpc Skeletonzombie">Zombie</option>
                </select>
            </div>
        </div>
        <div id="btn-container">
            <!-- Buttons will be generated by JS here -->
        </div>
    </div>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "fflate": "https://unpkg.com/three@0.160.0/examples/jsm/libs/fflate.module.js"
            }
        }
    </script>

    <!-- Dev Testing Script -->
    <script type="module" src="js/Girl.js"></script>

</body>
</html>
