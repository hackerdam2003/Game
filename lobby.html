<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Universe | Lobby</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #1a1a1a; color: white; padding: 20px; }
        .box { background: #333; padding: 20px; border-radius: 10px; width: 90%; max-width: 500px; margin: auto; }
        .profile-card { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: left;}
        .profile-card p { margin: 5px 0; font-size: 16px; color: #4ade80;}
        button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; }
        .btn-create { background: #ff4757; color: white; }
        .btn-join { background: #3742fa; color: white; }
        button:disabled { background: #888; cursor: not-allowed; }
        #gpsStatus { color: #fbbf24; font-size: 14px; margin-bottom: 10px; }
        .room-list { list-style: none; padding: 0; text-align: left; }
        .room-item { background: #444; margin: 10px 0; padding: 15px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .join-room-btn { background: #2ed573; color: white; padding: 8px 15px; border-radius: 3px; font-size: 14px; width: auto; margin: 0;}
    </style>
</head>
<body>

    <div class="box">
        <h2>🏁 Racing Lobby</h2>
        
        <div class="profile-card">
            <p id="playerName">👤 Driver: Loading...</p>
            <p id="playerStats">🧬 Age: -- | Gender: --</p>
            <p id="playerWallet">🪙 Wallet: 0</p>
        </div>

        <p id="gpsStatus">Waiting to start matchmaking...</p>

        <button id="createRoomBtn" class="btn-create">➕ Create Local Match (Needs GPS)</button>
        
        <h3 style="margin-top: 30px; border-bottom: 1px solid #555; padding-bottom: 10px;">Nearby Race Rooms</h3>
        <ul id="roomsList" class="room-list">
            <li>Loading rooms...</li>
        </ul>
    </div>

    <!-- Firebase Connection -->
    <script type="module" src="js/lobby.js"></script>
</body>
</html>
