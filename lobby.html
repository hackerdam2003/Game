    <!-- Include Socket.io client script -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Core Firebase & App Initialization -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const engineConfig = {
            apiKey: "AIzaSyCuYPugV4qIsu9ZT9E5l63bFLgIbte_S8I",
            authDomain: "racing-universe-engine.firebaseapp.com",
            projectId: "racing-universe-engine",
            storageBucket: "racing-universe-engine.firebasestorage.app",
            messagingSenderId: "572638328716",
            appId: "1:572638328716:web:830bd01db1fa5b45d948a9"
        };

        const app = initializeApp(engineConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Make globally accessible for modular files (friends.js, chat.js, etc.)
        window.db = db;
        window.socket = io(); 
        window.localUser = null;
        window.myProfileData = null;
        let activeTargetUid = null;

        const playerNameEl = document.getElementById("player-name");
        const playerCoinsEl = document.getElementById("player-coins");
        const mainCharName = document.getElementById("main-char-name");
        const mainCharInfo = document.getElementById("main-char-info");
        const mainAvatarIcon = document.getElementById("main-avatar-icon");
        const gpsStatusText = document.getElementById("gps-status-text");
        const startMatchBtn = document.getElementById("start-match-btn");

        // 1. Auth State Observer & Online Heartbeat
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.localUser = user;
                try {
                    const userRef = doc(db, "Users", user.uid);
                    
                    // Update Online Presence Timestamp
                    await updateDoc(userRef, { lastActive: serverTimestamp() });

                    const docSnap = await getDoc(userRef);
                    if (docSnap.exists()) {
                        window.myProfileData = docSnap.data();
                        playerNameEl.innerText = `${window.myProfileData.gameName} (${window.myProfileData.playerTag || 'UID'})`;
                        playerCoinsEl.innerText = `${window.myProfileData.wallet_balance || 0} 🪙`;
                        
                        mainCharName.innerText = window.myProfileData.gameName;
                        mainCharInfo.innerText = `${window.myProfileData.gender} • Age: ${window.myProfileData.age}`;
                        mainAvatarIcon.innerText = window.myProfileData.gender === 'Girl' ? '👧' : '👦';

                        // Register Socket Identity
                        window.socket.emit('registerPlayer', {
                            uid: user.uid,
                            gameName: window.myProfileData.gameName
                        });
                    } else {
                        window.location.href = "profile.html";
                    }
                } catch (err) {
                    console.error("Profile load error", err);
                }
            } else {
                window.location.href = "index.html";
            }
        });

        // 2. Drawer Controls Setup
        const setupDrawer = (btnId, drawerId, closeId) => {
            const btn = document.getElementById(btnId);
            const drawer = document.getElementById(drawerId);
            const closeBtn = document.getElementById(closeId);
            if(btn && drawer && closeBtn) {
                btn.addEventListener('click', () => {
                    drawer.classList.add('open');
                    // Trigger data fetch when opening drawers
                    if(drawerId === 'friends-drawer') {
                        if(window.loadGlobalPlayers) window.loadGlobalPlayers();
                        if(window.loadMyFriendsData) window.loadMyFriendsData();
                    }
                });
                closeBtn.addEventListener('click', () => drawer.classList.remove('open'));
            }
        };

        setupDrawer('btn-chat', 'chat-drawer', 'close-chat');
        setupDrawer('btn-friends', 'friends-drawer', 'close-friends');
        setupDrawer('btn-party-create', 'party-drawer', 'close-party');

        // 3. Profile Modal Handlers
        window.showMyProfile = function() {
            if (!window.myProfileData || !window.localUser) return;
            window.openUserProfile(window.myProfileData.gameName, window.myProfileData.age, window.myProfileData.location || "India, CG", window.myProfileData.gender, window.myProfileData.playerTag || "--------", window.localUser.uid, true);
        };

        window.openUserProfile = function(name, age, location, gender, uidTag, targetUid, isSelf = false) {
            activeTargetUid = targetUid;
            document.getElementById('modal-gamename').innerText = name;
            document.getElementById('modal-realname').innerText = isSelf ? `UID: ${uidTag} (You)` : `Real Identity Verified`;
            document.getElementById('modal-uid').innerText = uidTag;
            document.getElementById('modal-age').innerText = age;
            document.getElementById('modal-location').innerText = location;
            document.getElementById('modal-gender').innerText = gender;
            document.getElementById('modal-avatar').innerText = gender === 'Girl' ? '👧' : '👦';
            
            const actionsWrapper = document.getElementById('modal-actions-wrapper');
            actionsWrapper.innerHTML = '';
            
            if (!isSelf) {
                actionsWrapper.innerHTML = `
                    <button class="modal-action-btn" onclick="window.sendFriendReq('${targetUid}', '${name}')">Send Friend Request</button>
                    <button class="modal-team-btn" onclick="alert('Team invite feature active!')">Team Join Request</button>
                `;
            }
            document.getElementById('profile-modal').style.display = 'flex';
        };

        window.closeProfileModal = function() {
            document.getElementById('profile-modal').style.display = 'none';
        };

        window.copyUID = function() {
            const uidText = document.getElementById('modal-uid').innerText;
            if (uidText && uidText !== '--') {
                navigator.clipboard.writeText(uidText).then(() => alert("📋 UID Copied: " + uidText));
            }
        };

        // 4. Matchmaking Host Trigger
        startMatchBtn.addEventListener('click', () => {
            if (navigator.geolocation) {
                gpsStatusText.innerText = "📍 Requesting GPS Location...";
                gpsStatusText.style.color = "#fbbf24";

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        gpsStatusText.innerText = `✅ GPS Locked! Creating Room...`;
                        gpsStatusText.style.color = "#10b981";
                        startMatchBtn.innerText = "Setting up Room...";
                        startMatchBtn.disabled = true;
                        
                        setTimeout(() => {
                            const newRoomId = "RU-" + Math.floor(1000 + Math.random() * 9000);
                            window.location.href = `game.html?roomId=${newRoomId}&isHost=true`;
                        }, 1200);
                    },
                    (error) => {
                        gpsStatusText.innerText = "❌ GPS Denied!";
                        gpsStatusText.style.color = "#ef4444";
                        alert("Please allow Location permission!");
                    }
                );
            } else {
                alert("GPS not supported.");
            }
        });
    </script>

    <!-- Load Modular External Scripts -->
    <script type="module" src="js/friends.js"></script>
    <script type="module" src="js/chat.js"></script>
    <script type="module" src="js/team.js"></script>
