<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Racing Universe | Setup Profile</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #0f172a; color: #f1f5f9; padding-top: 40px; margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .box { background: #1e293b; padding: 25px 20px; border-radius: 14px; width: 90%; max-width: 400px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        h3 { color: #3b82f6; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top: 0; text-transform: uppercase; font-size: 16px; letter-spacing: 0.5px; }
        .info-text { font-size: 13px; text-align: left; margin: 12px 0 4px 0; color: #94a3b8; font-weight: bold; }
        .locked-name { color: #10b981; font-size: 16px; font-weight: bold; text-align: left; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; background: #0f172a; border: 1px solid #334155; color: white; outline: none; }
        input:focus, select:focus { border-color: #3b82f6; }
        button { width: 100%; padding: 14px; margin-top: 20px; border-radius: 8px; background: #10b981; color: white; font-weight: 900; cursor: pointer; border: none; font-size: 15px; text-transform: uppercase; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); }
        button:hover { background: #059669; }
        button:disabled { background: #64748b; box-shadow: none; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="box">
        <h3>Verify Identity</h3>
        
        <p class="info-text">Official Driver Name (Locked):</p>
        <div class="locked-name" id="displayNameDisplay">Loading...</div>
        
        <p class="info-text">Select Gender (Permanent):</p>
        <select id="genderSelect" required>
            <option value="">-- Choose Gender --</option>
            <option value="Boy">Boy</option>
            <option value="Girl">Girl</option>
        </select>

        <p class="info-text">Location (State/Country):</p>
        <input type="text" id="locationInput" placeholder="e.g., Mumbai, India" required>

        <p class="info-text">Date of Birth:</p>
        <input type="date" id="dobInput" required>
        
        <button id="saveProfileBtn">Lock Profile & Enter Lobby</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const engineConfig = {
            apiKey: "AIzaSyCuYPugV4qIsu9ZT9E5l63bFLgIbte_S8I",
            authDomain: "racing-universe-engine.firebaseapp.com",
            projectId: "racing-universe-engine",
            storageBucket: "racing-universe-engine.firebasestorage.app",
            messagingSenderId: "572638328716",
            appId: "1:572638328716:web:830bd01db1fa5b45d948a9"
        };

        const app = initializeApp(engineConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let currentUser = null;
        let existingData = {}; // 🛑 STORE EVERYTHING TO PREVENT DATA LOSS

        const displayNameDisplay = document.getElementById('displayNameDisplay');
        const saveProfileBtn = document.getElementById('saveProfileBtn');
        const genderSelect = document.getElementById('genderSelect');
        const locationInput = document.getElementById('locationInput');
        const dobInput = document.getElementById('dobInput');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                displayNameDisplay.innerText = user.displayName || "Racer";

                try {
                    const userSnap = await getDoc(doc(db, "Users", user.uid));
                    if (userSnap.exists()) {
                        existingData = userSnap.data(); // Purana saara data yahan save ho jayega
                        
                        if (existingData.gender) genderSelect.value = existingData.gender;
                        if (existingData.location) locationInput.value = existingData.location;
                        if (existingData.dob) dobInput.value = existingData.dob;
                    }
                } catch (e) {
                    console.error("Error reading profile:", e);
                }
            } else {
                window.location.href = "index.html";
            }
        });

        saveProfileBtn.addEventListener('click', async () => {
            const gender = genderSelect.value;
            const location = locationInput.value.trim();
            const dob = dobInput.value;

            if (!gender || !location || !dob) {
                alert("Please fill in Gender, Location, and Date of Birth.");
                return;
            }

            const birthDate = new Date(dob);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }

            saveProfileBtn.innerText = "Locking Database...";
            saveProfileBtn.disabled = true;

            const finalUID = existingData.playerTag || Math.floor(10000000 + Math.random() * 90000000).toString();

            // Safe Payload
            const profilePayload = {
                name: currentUser.displayName || "Racer",
                email: currentUser.email || "",
                gameName: currentUser.displayName || "Racer", 
                gender: gender,
                location: location,
                dob: dob,
                age: age,
                playerTag: finalUID,
                role: existingData.role || "player" // Preserve role (e.g., if user is admin)
            };

            // 🛑 ECONOMY & JOIN DATE PROTECTOR: Sirf tab set karo jab user bilkul naya ho
            if (existingData.wallet_balance === undefined) {
                profilePayload.wallet_balance = 0;
            }
            if (!existingData.joined) {
                profilePayload.joined = new Date().toISOString();
            }

            try {
                await setDoc(doc(db, "Users", currentUser.uid), profilePayload, { merge: true });
                window.location.href = "lobby.html";
            } catch (error) {
                alert("❌ Database Error! Try again.");
                saveProfileBtn.disabled = false;
                saveProfileBtn.innerText = "Lock Profile & Enter Lobby";
            }
        });
    </script>
</body>
</html>
