<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Racing Universe | Live Match</title>
    <style>
        body { margin: 0; padding: 0; background: #0f172a; overflow: hidden; font-family: 'Segoe UI', sans-serif; user-select: none; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        
        /* The HUD (Heads-Up Display) */
        .hud { position: absolute; z-index: 10; color: white; text-shadow: 1px 1px 2px black; }
        #top-hud { top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: none; }
        .hud-box { background: rgba(15, 23, 42, 0.85); padding: 10px 15px; border-radius: 10px; border: 1px solid #334155; box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: auto;}
        
        /* Fuel Dynamics */
        #fuel-title { font-size: 10px; color: #94a3b8; letter-spacing: 1px; font-weight: bold; }
        #fuel-bar-container { width: 150px; height: 12px; background: #333; border-radius: 6px; margin-top: 4px; border: 1px solid #000; overflow: hidden; }
        #fuel-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ef4444 0%, #f59e0b 50%, #10b981 100%); transition: width 0.3s linear; }
        
        #speedometer { font-size: 16px; font-weight: 900; margin-bottom: 5px; color: #3b82f6; }
        
        /* In-Game Chat System */
        #chat-container { position: absolute; left: 15px; top: 90px; width: 260px; height: 160px; background: rgba(15, 23, 42, 0.85); border: 1px solid #334155; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; pointer-events: auto;}
        #chat-messages { flex-grow: 1; overflow-y: auto; padding: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
        .chat-msg { margin-bottom: 2px; line-height: 1.3; }
        #chat-input-area { display: flex; border-top: 1px solid #334155; }
        #chat-input { flex-grow: 1; background: #0f172a; border: none; color: white; padding: 8px; font-size: 12px; outline: none; }
        #chat-send { background: #3b82f6; color: white; border: none; padding: 0 12px; cursor: pointer; font-weight: bold; }

        /* Mobile Driving Controls (Left Side) */
        #steering-controls { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 10px; }
        .steer-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 10px; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(2px); }
        .steer-btn:active { background: rgba(255,255,255,0.3); }

        /* Action Controls (Right Side) */
        #controls-hud { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 15px; align-items: flex-end;}
        .action-btn { width: 65px; height: 65px; border-radius: 50%; font-size: 28px; font-weight: bold; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.1s; backdrop-filter: blur(5px); }
        .action-btn:active { transform: scale(0.9); }
        
        #btn-gas { background: rgba(16, 185, 129, 0.8); width: 80px; height: 80px; font-size: 35px; box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
        #btn-brake { background: rgba(239, 68, 68, 0.8); box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
        
        /* Special Ability Buttons */
        .ability-row { display: flex; gap: 10px; margin-bottom: 10px; justify-content: flex-end; width: 100%;}
        .small-btn { width: 50px; height: 50px; font-size: 20px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #btn-kil { background: rgba(168, 85, 247, 0.8); } /* Trap */
        #btn-push { background: rgba(245, 158, 11, 0.8); display: none; } /* Only for Padal */
    </style>
</head>
<body>
    <div id="game-container">
        
        <!-- UI Overlay -->
        <div id="top-hud" class="hud">
            <div class="hud-box">
                <div id="speedometer">SPEED: 0 km/h</div>
                <div id="fuel-title">FUEL RESERVES</div>
                <div id="fuel-bar-container"><div id="fuel-fill"></div></div>
            </div>
            
            <div class="hud-box" style="text-align: right; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <div style="font-size: 10px; color: #94a3b8; font-weight: bold;">ROOM ID</div>
                <div id="room-id-display" style="font-size: 14px; font-weight: bold; color: #fbbf24;">----</div>
                <button id="start-race-btn" style="display:none; background: #10b981; color: white; border: none; padding: 5px 10px; border-radius: 3px; font-weight: bold; margin-top: 5px; cursor: pointer;">Start Race</button>
            </div>

            <div class="hud-box" style="text-align: right;">
                <div id="match-coins" style="font-size: 18px; font-weight: 900; color: #fbbf24; margin-bottom: 5px;">0 🪙</div>
                <div style="font-size: 12px; color: #94a3b8;">PING: <span id="ping-display" style="color: #10b981;">-- ms</span></div>
            </div>
        </div>

        <!-- In-Game Chat System (Fixed & Connected) -->
        <div id="chat-container" class="hud">
            <div id="chat-messages">
                <div class="chat-msg"><span style="color:#94a3b8">[System]: Synchronizing match...</span></div>
            </div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type message..." maxlength="40">
                <button id="chat-send">Send</button>
            </div>
        </div>

        <!-- Mobile Steering (Left) -->
        <div id="steering-controls" class="hud">
            <div id="btn-left" class="steer-btn">⬅️</div>
            <div id="btn-right" class="steer-btn">➡️</div>
        </div>

        <!-- Mobile Actions (Right) -->
        <div id="controls-hud" class="hud" style="flex-direction: column;">
            <div class="ability-row">
                <div id="btn-push" class="small-btn" title="Push Player">🥊</div>
                <div id="btn-kil" class="small-btn" title="Drop Trap (-5 Coins)">🪤</div>
            </div>
            <div style="display: flex; gap: 15px; align-items: flex-end;">
                <div id="btn-brake" class="action-btn" title="Brake/Reverse">🛑</div>
                <div id="btn-gas" class="action-btn" title="Accelerate">🔥</div>
            </div>
        </div>

    </div>

    <!-- Required Libraries -->
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

    <!-- Game Brain & Bug Fixes Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const engineConfig = {
            apiKey: "AIzaSyCuYPugV4qIsu9ZT9E5l63bFLgIbte_S8I",
            authDomain: "racing-universe-engine.firebaseapp.com",
            projectId: "racing-universe-engine",
            storageBucket: "racing-universe-engine.firebasestorage.app",
            messagingSenderId: "572638328716",
            appId: "1:572638328716:web:830bd01db1fa5b45d948a9"
        };

        const app = initializeApp(engineConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 1. Read Room ID from URL Parameters (Fixes routing bug)
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId') || "GENERAL_ROOM";
        document.getElementById("room-id-display").innerText = roomId.substring(0, 6).toUpperCase();

        // 2. Initialize Socket.io Connection to Node.js Server
        const socket = io(); // Connects to current Render host automatically

        socket.on('connect', () => {
            console.log("Connected to Racing Engine Server ID:", socket.id);
            socket.emit('joinGameRoom', { roomId });
        });

        // 3. Authenticated User Data Sync
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "Users", user.uid));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById("match-coins").innerText = `${data.wallet_balance || 0} 🪙`;
                    
                    // If player is on foot (Padal), display push ability button
                    if(data.vehicle === "Padal") {
                        document.getElementById("btn-push").style.display = "flex";
                    }
                }
            } else {
                window.location.href = "index.html";
            }
        });

        // 4. In-Game Chat System Fix
        const chatInput = document.getElementById('chat-input');
        const chatSend = document.getElementById('chat-send');
        const chatMessages = document.getElementById('chat-messages');

        function sendInGameMessage() {
            const text = chatInput.value.trim();
            if(!text) return;

            socket.emit('chatMessage', {
                channel: 'race',
                roomId: roomId,
                text: text
            });

            chatInput.value = '';
        }

        chatSend.addEventListener('click', sendInGameMessage);
        chatInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') sendInGameMessage();
        });

        socket.on('receiveChat', (data) => {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg';
            msgDiv.innerHTML = `<span style="color: #60a5fa;">${data.sender}:</span> <span style="color: #f8fafc;">${data.text}</span>`;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        // 5. Trap Economy Integration (Kil Button)
        document.getElementById('btn-kil').addEventListener('click', () => {
            socket.emit('dropTrap', { roomId });
        });
    </script>

    <!-- Core Engine: Connects Phaser Physics -->
    <script type="module" src="js/engine.js"></script>
</body>
</html>
