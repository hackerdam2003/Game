<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Racing Universe | Open World</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* Canvas fixed to cover black screen issues */
        #game-canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: -1; }

        /* Enter Screen */
        #enter-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.95); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .enter-btn { background: #3b82f6; color: white; border: none; padding: 15px 40px; font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 20px rgba(59,130,246,0.5); }

        #hud { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Minimap Container (Positioning handled dynamically in minimap.js) */
        .hud-minimap { pointer-events: auto; }

        /* Joystick Controls */
        .joystick-zone { position: absolute; bottom: 20px; left: 30px; width: 130px; height: 130px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); pointer-events: auto; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .joystick-knob { width: 45px; height: 45px; background: rgba(255,255,255,0.6); border-radius: 50%; pointer-events: none; }

        /* Action Buttons */
        .action-cluster { position: absolute; bottom: 20px; right: 30px; pointer-events: auto; width: 180px; height: 180px; z-index: 100; }
        .btn-action { position: absolute; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); transition: 0.1s; cursor: pointer; }
        .btn-action:active { background: rgba(255,255,255,0.4); transform: scale(0.9); }
        .btn-main { width: 70px; height: 70px; bottom: 10px; right: 10px; font-size: 24px; }
        .btn-skill { width: 50px; height: 50px; bottom: 90px; right: 20px; font-size: 18px; }
    </style>
</head>
<body>

    <div id="enter-overlay">
        <button class="enter-btn" onclick="enterWorld()">Tap to Enter World</button>
    </div>

    <!-- 3D Canvas -->
    <canvas id="game-canvas"></canvas>

    <div id="hud">
        <!-- Minimap Hook -->
        <div class="hud-minimap"></div>

        <!-- Joystick -->
        <div class="joystick-zone" id="joystick-base">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>

        <!-- Action Buttons -->
        <div class="action-cluster">
            <div class="btn-action btn-main" id="btn-attack">⚔️</div>
            <div class="btn-action btn-skill" id="btn-skill">🔥</div>
        </div>
    </div>

    <!-- Socket.io library -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "fflate": "https://unpkg.com/three@0.160.0/examples/jsm/libs/fflate.module.js"
            }
        }
    </script>

    <!-- Game Script (Engine handles Chat, Connection, and Player List now) -->
    <script type="module" src="js/engine.js"></script> 

</body>
</html>
