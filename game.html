<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Procedural Anatomy & Physics</title>
    <style>
        body { margin: 0; background: #0f172a; color: white; display: flex; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* UI Panel */
        .ui-panel { width: 300px; background: #1e293b; padding: 20px; border-right: 2px solid #334155; display: flex; flex-direction: column; gap: 15px; z-index: 10; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
        .ui-panel h2 { color: #3b82f6; margin: 0 0 10px 0; font-size: 18px; text-transform: uppercase; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        
        .slider-group { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: bold; color: #cbd5e1; }
        input[type=range] { accent-color: #10b981; cursor: pointer; }
        input[type=color] { border: none; width: 40px; height: 30px; cursor: pointer; background: transparent; }
        .row { display: flex; justify-content: space-between; align-items: center; }

        /* Canvas Area */
        .canvas-container { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at center, #334155 0%, #0f172a 100%); }
        canvas { filter: drop-shadow(0px 20px 30px rgba(0,0,0,0.8)); cursor: grab; }
        canvas:active { cursor: grabbing; }
        
        .instruction { position: absolute; top: 20px; font-size: 18px; color: #fbbf24; font-weight: bold; text-shadow: 0 2px 5px rgba(0,0,0,1); pointer-events: none; }
    </style>
</head>
<body>

    <div class="ui-panel">
        <h2>🛠️ DNA & Physics Setup</h2>
        
        <div class="slider-group">
            <div class="row"><span>Waist Size</span> <span id="val-waist">1.0</span></div>
            <input type="range" id="waist" min="0.6" max="1.4" step="0.05" value="0.9">
        </div>
        
        <div class="slider-group">
            <div class="row"><span>Hip / Pelvis</span> <span id="val-hips">1.0</span></div>
            <input type="range" id="hips" min="0.8" max="1.6" step="0.05" value="1.2">
        </div>
        
        <div class="slider-group">
            <div class="row"><span>Chest / Breast Volume</span> <span id="val-chest">1.0</span></div>
            <input type="range" id="chest" min="0.5" max="1.8" step="0.05" value="1.3">
        </div>

        <div class="slider-group">
            <div class="row"><span>Skin Tone</span></div>
            <input type="color" id="skin" value="#e5a073">
        </div>
        
        <div class="slider-group">
            <div class="row"><span>Bikini / Clothes</span></div>
            <input type="color" id="clothes" value="#10b981">
        </div>
        
        <div style="margin-top: auto; font-size: 11px; color: #64748b; line-height: 1.5;">
            * Move sliders to customize body parts.<br>
            * Grab the blue hand on screen to trigger Inverse Kinematics & Jiggle Physics.
        </div>
    </div>

    <div class="canvas-container">
        <div class="instruction">👆 Drag the Blue Hand to see Body Physics & Movement!</div>
        <canvas id="gameCanvas" width="500" height="700"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // State & Customization Variables
        const state = { waist: 0.9, hips: 1.2, chest: 1.3, skin: '#e5a073', clothes: '#10b981' };

        // UI Listeners
        ['waist', 'hips', 'chest'].forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                state[id] = parseFloat(e.target.value);
                document.getElementById(`val-${id}`).innerText = state[id].toFixed(2);
            });
        });
        ['skin', 'clothes'].forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => state[id] = e.target.value);
        });

        // Mouse Interactivity (For grabbing the hand)
        let mouse = { x: 150, y: 350, isDown: false };
        canvas.addEventListener('mousedown', () => mouse.isDown = true);
        canvas.addEventListener('mouseup', () => mouse.isDown = false);
        canvas.addEventListener('mousemove', (e) => {
            if(mouse.isDown) {
                const rect = canvas.getBoundingClientRect();
                mouse.x = e.clientX - rect.left;
                mouse.y = e.clientY - rect.top;
            }
        });

        // 1. JIGGLE PHYSICS ENGINE (Hooke's Law for Chest)
        class JiggleNode {
            constructor(stiffness, damping) {
                this.x = 0; this.y = 0;
                this.vx = 0; this.vy = 0;
                this.k = stiffness; this.d = damping;
            }
            update(targetX, targetY) {
                let forceX = (targetX - this.x) * this.k;
                let forceY = (targetY - this.y) * this.k;
                this.vx = (this.vx + forceX) * this.d;
                this.vy = (this.vy + forceY) * this.d;
                this.x += this.vx; this.y += this.vy;
            }
        }
        const chestNodeL = new JiggleNode(0.08, 0.82); // Physics parameters
        const chestNodeR = new JiggleNode(0.08, 0.82);

        // 2. INVERSE KINEMATICS (IK) FOR ARM
        function calculateIK(shoulder, target, upperArmLen, lowerArmLen) {
            let dx = target.x - shoulder.x;
            let dy = target.y - shoulder.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if (dist > upperArmLen + lowerArmLen) { // Prevent breaking arm
                dx = (dx / dist) * (upperArmLen + lowerArmLen - 1);
                dy = (dy / dist) * (upperArmLen + lowerArmLen - 1);
                dist = upperArmLen + lowerArmLen - 1;
            }

            let angle1 = Math.atan2(dy, dx);
            let angle2 = Math.acos((upperArmLen*upperArmLen + dist*dist - lowerArmLen*lowerArmLen) / (2 * upperArmLen * dist));
            if(isNaN(angle2)) angle2 = 0;

            let elbowX = shoulder.x + Math.cos(angle1 - angle2) * upperArmLen;
            let elbowY = shoulder.y + Math.sin(angle1 - angle2) * upperArmLen;

            return { x: elbowX, y: elbowY };
        }

        // Shading Helper
        function getSkinShader(x, y, r1, r2, isDark=false) {
            let grad = ctx.createRadialGradient(x, y, r1, x, y, r2);
            grad.addColorStop(0, state.skin);
            grad.addColorStop(1, 'rgba(0,0,0,0.5)'); // Fake 3D Shadow
            return grad;
        }

        // 3. MAIN RENDER LOOP
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2 + 50); // Anchor at hips

            // Dynamic Sizes based on sliders
            const hipW = 35 * state.hips;
            const waistW = 25 * state.waist;
            const chestVol = 18 * state.chest;
            const bodyH = 120;

            // --- A. PHYSICS CALCULATIONS ---
            let time = Date.now() * 0.003;
            let breath = Math.sin(time) * 2; // Breathing idle animation
            
            // Chest reacts to arm being pulled!
            let armPullX = (mouse.x - (canvas.width/2 - 50)) * 0.02; 
            
            chestNodeL.update(-15 + armPullX, -bodyH + 40 + breath);
            chestNodeR.update(15 + armPullX, -bodyH + 40 + breath);

            // --- B. DRAW LEGS & HIPS ---
            ctx.fillStyle = getSkinShader(0, 50, 10, hipW*1.5);
            ctx.beginPath(); ctx.ellipse(-hipW/1.5, 80, hipW*0.6, 90, 0.1, 0, Math.PI*2); ctx.fill(); // L Thigh
            ctx.beginPath(); ctx.ellipse(hipW/1.5, 80, hipW*0.6, 90, -0.1, 0, Math.PI*2); ctx.fill(); // R Thigh
            ctx.beginPath(); ctx.ellipse(0, 20, hipW*0.9, 35, 0, 0, Math.PI*2); ctx.fill(); // Pelvis

            // Bikini Bottom
            ctx.fillStyle = state.clothes;
            ctx.beginPath(); ctx.moveTo(-hipW+5, 0); ctx.lineTo(hipW-5, 0); ctx.quadraticCurveTo(0, 80, 0, 80); ctx.fill();

            // --- C. DRAW TORSO (Hourglass shape) ---
            ctx.fillStyle = getSkinShader(0, -bodyH/2, 10, 80);
            ctx.beginPath();
            ctx.moveTo(-hipW*0.8, 0); 
            ctx.quadraticCurveTo(-waistW, -bodyH/2, -35, -bodyH); 
            ctx.lineTo(35, -bodyH); 
            ctx.quadraticCurveTo(waistW, -bodyH/2, hipW*0.8, 0); 
            ctx.fill();

            // --- D. DRAW JIGGLING CHEST (Soft Body) ---
            ctx.fillStyle = getSkinShader(chestNodeL.x-5, chestNodeL.y-5, 2, chestVol*1.2);
            ctx.beginPath(); ctx.ellipse(chestNodeL.x, chestNodeL.y, chestVol, chestVol*0.85, -0.1, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = getSkinShader(chestNodeR.x+5, chestNodeR.y-5, 2, chestVol*1.2);
            ctx.beginPath(); ctx.ellipse(chestNodeR.x, chestNodeR.y, chestVol, chestVol*0.85, 0.1, 0, Math.PI*2); ctx.fill();
            
            // Bikini Top
            ctx.fillStyle = state.clothes;
            ctx.beginPath(); ctx.ellipse(chestNodeL.x, chestNodeL.y+5, chestVol*0.9, chestVol*0.6, -0.2, 0, Math.PI); ctx.fill();
            ctx.beginPath(); ctx.ellipse(chestNodeR.x, chestNodeR.y+5, chestVol*0.9, chestVol*0.6, 0.2, 0, Math.PI); ctx.fill();

            // --- E. DRAW HEAD ---
            ctx.fillStyle = state.skin;
            ctx.fillRect(-6, -bodyH - 20, 12, 25); // Neck
            ctx.fillStyle = getSkinShader(0, -bodyH-50, 5, 40);
            ctx.beginPath(); ctx.ellipse(0, -bodyH-50, 22, 28, 0, 0, Math.PI*2); ctx.fill(); // Face
            ctx.fillStyle = '#1e293b'; // Hair
            ctx.beginPath(); ctx.ellipse(0, -bodyH-75, 26, 20, 0, 0, Math.PI*2); ctx.fill();

            // --- F. DRAW WORKING ARM (Inverse Kinematics) ---
            let shoulderL = { x: -35, y: -bodyH + 20 };
            
            // Transform mouse coordinates relative to canvas center
            let handTarget = { x: mouse.x - canvas.width/2, y: mouse.y - (canvas.height/2 + 50) };
            
            let elbow = calculateIK(shoulderL, handTarget, 65, 65);

            // Draw Upper Arm
            ctx.strokeStyle = state.skin;
            ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.beginPath(); ctx.moveTo(shoulderL.x, shoulderL.y); ctx.lineTo(elbow.x, elbow.y); ctx.stroke();

            // Draw Lower Arm
            ctx.beginPath(); ctx.moveTo(elbow.x, elbow.y); ctx.lineTo(handTarget.x, handTarget.y); ctx.stroke();

            // Draw Draggable Hand Indicator
            ctx.fillStyle = mouse.isDown ? '#ef4444' : '#3b82f6';
            ctx.beginPath(); ctx.arc(handTarget.x, handTarget.y, 10, 0, Math.PI*2); ctx.fill();

            // Right Arm (Static)
            ctx.beginPath(); ctx.moveTo(35, -bodyH + 20); ctx.lineTo(50, -bodyH + 70); ctx.lineTo(40, -10); ctx.stroke();

            ctx.restore();
            requestAnimationFrame(draw);
        }

        draw(); // Start Engine
    </script>
</body>
</html>
