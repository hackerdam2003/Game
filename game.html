<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Racing Universe | Open World</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        #game-canvas { display: block; width: 100%; height: 100%; background: #0f172a; }

        #enter-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.95); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .enter-btn { background: #3b82f6; color: white; border: none; padding: 15px 40px; font-size: 20px; font-weight: 900; border-radius: 30px; cursor: pointer; box-shadow: 0 0 20px rgba(59,130,246,0.5); text-transform: uppercase; }

        #hud { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .hud-profile { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; border: 1px solid #334155; display: flex; align-items: center; gap: 10px; pointer-events: auto; backdrop-filter: blur(5px); }
        .hud-profile .hp-bar { width: 100px; height: 6px; background: #334; border-radius: 3px; overflow: hidden; }
        .hud-profile .hp-fill { width: 100%; height: 100%; background: #10b981; }

        .hud-minimap { position: absolute; top: 20px; right: 20px; width: 120px; height: 120px; background: rgba(30,41,59,0.7); border: 2px solid #3b82f6; border-radius: 50%; pointer-events: auto; backdrop-filter: blur(5px); }

        .joystick-zone { position: absolute; bottom: 30px; left: 40px; width: 140px; height: 140px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); pointer-events: auto; display: flex; align-items: center; justify-content: center; }
        .joystick-knob { width: 50px; height: 50px; background: rgba(255,255,255,0.6); border-radius: 50%; pointer-events: none; transform: translate(0px, 0px); }

        .action-cluster { position: absolute; bottom: 30px; right: 40px; pointer-events: auto; width: 200px; height: 200px; }
        .btn-action { position: absolute; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); transition: 0.1s; }
        .btn-action:active { background: rgba(255,255,255,0.4); transform: scale(0.9); }
        
        .btn-main { width: 80px; height: 80px; bottom: 10px; right: 10px; font-size: 24px; }
        .btn-skill { width: 55px; height: 55px; bottom: 100px; right: 30px; font-size: 18px; }
        .btn-jump { width: 55px; height: 55px; bottom: 30px; right: 100px; font-size: 18px; }
        .btn-dash { width: 45px; height: 45px; bottom: 110px; right: 100px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="enter-overlay">
        <button class="enter-btn" onclick="enterWorld()">Tap to Enter World</button>
    </div>

    <canvas id="game-canvas"></canvas>

    <div id="hud">
        <div class="hud-profile">
            <span style="font-size: 20px;">👦</span>
            <div style="color: white;">
                <div style="font-size: 12px; font-weight: bold; margin-bottom: 3px;" id="player-name-hud">Loading...</div>
                <div class="hp-bar"><div class="hp-fill"></div></div>
            </div>
        </div>

        <div class="hud-minimap"></div>

        <div class="joystick-zone" id="joystick-base">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>

        <div class="action-cluster">
            <div class="btn-action btn-main" id="btn-attack">⚔️</div>
            <div class="btn-action btn-skill" id="btn-skill">🔥</div>
            <div class="btn-action btn-jump" id="btn-jump">⬆️</div>
            <div class="btn-action btn-dash" id="btn-dash">💨</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/engine.js"></script> 
</body>
</html>
